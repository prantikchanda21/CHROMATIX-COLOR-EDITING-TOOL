name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit URL
        run: |
          curl -s https://chromatix-color-editing-tool-7cdszq8kzfnivcauucdsgz.streamlit.app/ > /dev/null || true
          echo "Streamlit app pinged successfully!"
          
      - name: Keep Workflow Alive
        uses: gautamkrishnar/keepalive-workflow@v1
